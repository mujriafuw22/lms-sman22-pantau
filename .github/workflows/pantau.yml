name: Pantau LMS

on:
  schedule:
    - cron: "*/5 * * * *"   # setiap 5 menit (GitHub kadang terlambat beberapa menit)
  workflow_dispatch:
    inputs:
      uji:
        description: "Kirim pesan uji ke Telegram"
        type: boolean
        default: true

permissions:
  contents: write   # hanya untuk menyimpan status.json

concurrency:
  group: pantau-lms
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - id: cek
        run: python3 cek.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UJI: ${{ github.event_name == 'workflow_dispatch' && inputs.uji }}

      - if: steps.cek.outputs.tulis == '1'
        run: |
          git config user.name "pemantau-lms"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "Status LMS: ${{ steps.cek.outputs.status }}"
          git push
