name: Pantau LMS

on:
  # Jadwal GitHub sering molor berjam-jam, jadi pemicu utamanya cron-job.org
  # yang memanggil workflow_dispatch setiap 5 menit. Jadwal ini hanya cadangan.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      uji:
        description: "Kirim pesan uji ke Telegram"
        type: boolean
        default: false   # false supaya panggilan otomatis dari cron-job.org tidak mengirim pesan uji

permissions:
  contents: write   # hanya untuk menyimpan status.json

concurrency:
  group: pantau-lms
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - id: cek
        run: python3 cek.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UJI: ${{ github.event_name == 'workflow_dispatch' && inputs.uji }}

      - if: steps.cek.outputs.tulis == '1'
        run: |
          git config user.name "pemantau-lms"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "Status LMS: ${{ steps.cek.outputs.status }}"
          git push
